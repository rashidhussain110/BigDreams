{% extends 'hod_template/base_template.html' %}

{% block page_title %}
    Edit Fee
{% endblock page_title %}

{% block main_content %}

<section class="content">
    <div class="container-fluid">

        <div class="row">
            <div class="col-md-8">

                <div class="card card-primary">

                    <div class="card-header">
                        <h3 class="card-title">Student Fee</h3>
                    </div>

                    <form method="POST" action="{% url 'edit_fee_save' %}">
                        {% csrf_token %}

                        <div class="card-body">

                            <input type="hidden" name="fee_id" value="{{ fee.id }}">

                            <div class="form-group">
                                <label>Student</label>
                                <input type="text"
                                       class="form-control"
                                       value="{{ fee.student_id.admin.first_name }} {{ fee.student_id.admin.last_name }}"
                                       readonly>
                            </div>

                            <div class="form-group">
                                <label>Total Fee</label>
                                <input type="number"
                                       name="total_fee"
                                       class="form-control"
                                       value="{{ fee.total_fee }}"
                                       min="0"
                                       step="0.01"
                                       required>
                            </div>

                            <div class="form-group">
                                <label>Paid Fee</label>
                                <input type="number"
                                       name="paid_fee"
                                       class="form-control"
                                       value="{{ fee.paid_fee }}"
                                       min="0"
                                       step="0.01"
                                       required>
                            </div>

                        </div>

                        <div class="card-footer">
                            <button type="submit" class="btn btn-primary">
                                Save Fee
                            </button>

                            <a href="{% url 'manage_fee' %}" class="btn btn-secondary">
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>

            </div>
        </div>

    </div>
</section>

{% endblock main_content %}
