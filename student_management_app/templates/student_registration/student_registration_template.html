{% extends 'student_registration/base.html' %}

{% block content %}

<div class="registration-container">

    <div class="registration-card">

        <div class="registration-header">
            <h2>Student Registration</h2>
            <p>Create your student account</p>
        </div>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <h4>Personal Information</h4>

            <div class="form-row">

                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="first_name" placeholder="Enter first name" required>
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="last_name" placeholder="Enter last name" required>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Enter Gmail address" required>
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" name="phone" placeholder="Enter phone number" required>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Profile Picture</label>
                    <input type="file" name="profile_pic">
                </div>

            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea name="address" placeholder="Enter your address" required></textarea>
            </div>

            <h4>Academic Information</h4>

            <div class="form-row">

                <div class="form-group">
                    <label>Course</label>

                     <select name="course" required>
                      <option value="">Select Course</option>

                        {% for course in courses %} 
                         <option value="{{ course.id }}">
                         {{ course.course_name }}
                         </option>
                        {% endfor %}

                    </select>
                </div>

            

            </div>

           <div class="form-group">
    <label>Session / Academic Year</label>

    <select name="session" required>
        <option value="">Select Session</option>

        {% for session in sessions %}
            <option value="{{ session.id }}">
                {{ session.session_start_year|date:"Y" }} - {{ session.session_end_year|date:"Y" }}
            </option>
        {% endfor %}

    </select>
</div>

            <h4>Account Information</h4>

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Create username" required>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Create password" required>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" placeholder="Confirm password" required>
                </div>

            </div>

            <button type="submit" class="register-btn">
                Create Student Account
            </button>

        </form>

    </div>

</div>

<style>

body {
    background: #f4f6f9;
}

.registration-container {
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 15px;
}

.registration-card {
    width: 100%;
    max-width: 850px;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.12);
}

.registration-header {
    text-align: center;
    margin-bottom: 30px;
}

.registration-header h2 {
    margin-bottom: 5px;
    font-weight: 600;
}

.registration-header p {
    color: #777;
}

.registration-card h4 {
    margin-top: 25px;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd;
}

.form-row {
    display: flex;
    gap: 20px;
}

.form-group {
    flex: 1;
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: 500;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
}

.form-group textarea {
    height: 90px;
    resize: vertical;
}

.register-btn {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    border: none;
    border-radius: 6px;
    background: #1e3c72;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.register-btn:hover {
    background: #2a5298;
}

@media (max-width: 650px) {

    .form-row {
        flex-direction: column;
        gap: 0;
    }

    .registration-card {
        padding: 22px;
    }

}

</style>

{% endblock content %}
